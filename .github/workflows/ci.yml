name: Brynse CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade \
            "certifi>=2026.10.18" \
            "filelock>=4.2.1" \
            "msgpack>=1.2.3,<2"
          python -m pip check

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Mypy
        run: mypy --follow-imports=skip src/

      - name: Bandit
        run: bandit -r src -c pyproject.toml

      - name: Dependency audit
        run: pip-audit --local
