[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxtuner-ripper"
version = "0.1.0.dev0"
description = "Native ICY radio stream ripper core extracted from FluxTuner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
authors = [
  { name = "FluxTuner contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
fluxtuner-ripper = "fluxtuner_ripper.integrations.radio.cli:main"
fluxtuner-ripper-segment = "fluxtuner_ripper.generic_cli:main"

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests"]
